version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: kriyo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://kriyo_user:kriyo_password@postgres:5432/kriyo_db
      - REDIS_URL=redis://redis:6379/0
      - RAG_SERVICE_URL=http://rag:8001/api/v1/rag
    depends_on:
      - postgres
      - redis

  rag:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.rag
    container_name: kriyo_rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - COLLECTION_NAME=kriyo_synthetic_corpus
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - ./kriyo_rag/storage:/app/storage
      - ./kriyo_rag/data:/app/data

  postgres:
    image: postgres:15-alpine
    container_name: kriyo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kriyo_user
      - POSTGRES_PASSWORD=kriyo_password
      - POSTGRES_DB=kriyo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: kriyo_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: kriyo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - rag

volumes:
  postgres_data:
  redis_data:
